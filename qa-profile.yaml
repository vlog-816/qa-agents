# Team profile (draft 0.2). Keys stay in English; values are filled in per team.
profile_version: "0.2"
team: "qa-pilot"                       # REQUIRED: fill in the team name (empty = Gate 0 HOLD)
language: bilingual                   # vi | en | bilingual (language of content generated by agents)
feature_id_format: jira_key    # jira_key (e.g. PROJ-123) | custom. Use FEAT-### only when there is no ticket

data:
  data_class: synthetic        # synthetic | masked | real (if unsure, treat as real)
  real_data_approval_ref: ""   # REQUIRED if data_class is real (approval number, approver, date)
  masking_approval_ref: ""     # REQUIRED if data_class is masked (security confirmation of the masking process)
  allowed_hosts:               # staging or local only
    - localhost                # pilot app: restful-booker-platform running locally
    - demowebshop.tricentis.com   # public demo shop for practice (web only). Use fake data only.
  no_production_hosts: true    # HUMAN DECLARATION: no production host exists to block (pilot with demo/local targets only). Set to false and fill blocked_hosts as soon as a production host exists.
  blocked_hosts: []            # production, never test. Must list production hosts unless no_production_hosts is true.

  # Gate 0 human confirmations. Data Guard cannot verify these from files.
  # A human fills them in. Leave "" / false until confirmed; Data Guard then returns HOLD.
  gate0_confirmations:
    approver: "Boss-QA"               # name of the person approving Gate 0
    date: "2026-11-03"                   # YYYY-MM-DD
    claude_plan_approved: true      # the Claude plan in use is approved for this data_class
    test_account_confirmed: true # dedicated minimum-privilege test account is used
    no_secrets_in_repo_confirmed: false          # no passwords/tokens in prompts or repo files (human confirms)
    allowed_hosts_confirmed_non_production: false  # every allowed host is staging/local/demo, not production (human confirms)

  # Scoped waiver: the approver knowingly skips the listed items for ONE feature. Data Guard reports them as WAIVED (not confirmed).
  # Remove this block when the demo is done and set the two confirmations above to true.
  gate0_waivers:
    feature_id: DEMO-001
    items: [no_secrets_in_repo_confirmed, allowed_hosts_confirmed_non_production]
    reason: "Public practice site https://demowebshop.tricentis.com, fake data only; approver will set the confirmations later"
    requested_by: "approver, in chat, 2026-11-03"

requirement_sources: [files]   # files | jira | web (start with files dropped into inbox/)
jira:
  type: cloud                  # unknown | cloud | server_dc
  project_key: ""
  mode: read-only

platforms: [api, web]          # add mobile later
test_management:
  tools: [repo]                # repo now; later: google_sheets | testrail | xray (export adapters)
automation:
  framework: playwright        # may change: selenium | cypress | other
  code_language: typescript

gates:                         # required | optional (relax gradually as trust grows)
  data: required               # Gate 0, always required
  requirements: required
  clarifications: required
  test_plan: required
  results: required
  automation: required

uncertainty_policy: stop_and_ask   # if the AI is unsure, stop and record it under "Open questions"
